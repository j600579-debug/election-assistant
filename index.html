<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Election Assistant</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Democracy Flow</h1>

<div class="nav">
  <button onclick="show('timeline')">Timeline</button>
  <button onclick="show('flash')">Flashcards</button>
  <button onclick="show('quiz')">Quiz</button>
  <button onclick="show('chat')">Chat</button>
</div>

<div id="timeline" class="section active">
  <h2>Election Timeline</h2>
  <p>1. Election Announcement</p>
  <p>2. Voter Registration</p>
  <p>3. Campaign</p>
  <p>4. Voting</p>
  <p>5. Counting</p>
</div>

<div id="flash" class="section">
  <h2>Flashcards</h2>
  <div class="card-container">
    <div class="card" onclick="flip(this,'Election Commission of India')">ECI</div>
    <div class="card" onclick="flip(this,'Electronic Voting Machine')">EVM</div>
    <div class="card" onclick="flip(this,'Voter Verified Paper Audit Trail')">VVPAT</div>
    <div class="card" onclick="flip(this,'Model Code of Conduct')">MCC</div>
    <div class="card" onclick="flip(this,'Returning Officer manages election')">RO</div>
    <div class="card" onclick="flip(this,'None Of The Above')">NOTA</div>
  </div>
</div>

<div id="quiz" class="section">
  <h2>Quiz</h2>
  <p id="q"></p>
  <button onclick="answer(0)" id="a0"></button>
  <button onclick="answer(1)" id="a1"></button>
  <button onclick="answer(2)" id="a2"></button>
  <p id="score"></p>
</div>

<div id="chat" class="section">
  <h2>Chat Assistant</h2>
  <div class="chat-box" id="chatbox"></div>
  <br>
  <input id="input" placeholder="Ask about voting...">
  <button onclick="send()">Send</button>
</div>

<script src="script.js"></script>

</body>
</html>
