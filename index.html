<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Election Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container" role="main">
    <header>
        <h2>🗳️ Smart Election Assistant</h2>
        <div class="language-selector">
            <button onclick="setLanguage('en')" id="btn-en" class="lang-btn active">English</button>
            <button onclick="setLanguage('ta')" id="btn-ta" class="lang-btn">தமிழ்</button>
        </div>
    </header>
    <div id="chatBox" role="log" aria-live="polite"></div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask something..." aria-label="user input">
        <div class="btn-group">
            <button onclick="sendMessage()" class="send-btn">Send</button>
            <button onclick="clearChat()" class="clear-btn">Clear</button>
        </div>
    </div>
</main>
<script src="script.js"></script>
</body>
</html>
