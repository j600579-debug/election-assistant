<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voter Awareness Portal</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="app-container">
    <header class="navbar">
        <div class="logo">VoterGuide AI</div>
        <nav class="nav-menu">
            <button class="nav-link active" onclick="showTab('chat')">AI Assistant</button>
            <button class="nav-link" onclick="showTab('cards')">Flashcards</button>
            <button class="nav-link" onclick="showTab('quiz')">Quiz</button>
        </nav>
    </header>

    <main class="content">
        <section id="chat" class="tab-content active">
            <div class="panel">
                <h2>Smart Voter Assistant</h2>
                <div id="chatWindow" class="chat-window">
                    <div class="bot-msg">வணக்கம்! ஓட்டுப் பதிவு அல்லது தேர்தல் விதிகள் பற்றி என்னிடம் கேளுங்கள்.</div>
                </div>
                <div class="input-area">
                    <input type="text" id="userInput" placeholder="உங்கள் கேள்வியைத் தட்டச்சு செய்க...">
                    <button onclick="askBot()">அனுப்பு</button>
                </div>
            </div>
        </section>

        <section id="cards" class="tab-content">
            <h2>Election Terms (10)</h2>
            <div class="grid" id="cardsGrid"></div>
        </section>

        <section id="quiz" class="tab-content">
            <h2>Test Your Knowledge (10)</h2>
            <div id="quizContainer" class="panel"></div>
        </section>
    </main>
</div>

<script src="script.js"></script>
</body>
</html>
